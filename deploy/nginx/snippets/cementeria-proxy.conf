# Reenvío a la app (Node en 127.0.0.1). Va en
# /etc/nginx/snippets/cementeria-proxy.conf y se incluye en cada location que
# hace proxy_pass: un proxy_set_header dentro de una location anula todos los
# heredados, así que van todos juntos acá.

proxy_http_version 1.1;
# Conexiones persistentes con el upstream (keepalive del bloque upstream).
proxy_set_header Connection "";

# La app compara el Origin de cada POST (Salir, las Server Actions) con Host,
# y decide por Host dónde ofrece el ingreso de prueba de staging. Con el valor
# por defecto de nginx le llegaría 127.0.0.1:3010 y el POST se rechazaría con
# 403 (pedido A4, punto 4). Es confiable porque el default_server corta todo
# Host que no sea el nuestro (deploy/nginx/00-cementeria-default.conf).
proxy_set_header Host $host;

# La IP que se guarda en auditoria.accesos (src/lib/auth/red.ts). nginx la
# PISA con la del cliente: si no, la app caería en X-Forwarded-For, que el
# cliente puede escribir. Por lo mismo X-Forwarded-For se reemplaza y no se
# acumula ($proxy_add_x_forwarded_for). X-Forwarded-Host no se manda: la app
# no lo usa y, si llegara, sería el que escribió el cliente.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Para que las redirecciones que arma Next (new URL(..., request.url)) salgan https.
proxy_set_header X-Forwarded-Proto $scheme;

# Next arma request.url con SU host y puerto (http://localhost:3010/…), no con
# el Host del pedido, y las redirecciones de los Route Handlers son absolutas
# sobre esa URL: Salir y el callback de Cidituc responderían
# "Location: https://localhost:3010/…" (comprobado con el paquete standalone,
# docs/despliegue.md). Esto las devuelve al dominio público. El puerto va como
# patrón para servir a producción (3010) y a staging.
proxy_redirect ~^https?://(?:localhost|127\.0\.0\.1|\[::1\])(?::[0-9]+)?(/.*)?$ https://$host$1;

# Next agrega "X-Powered-By: Next.js": no hace falta anunciar la versión.
proxy_hide_header X-Powered-By;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
