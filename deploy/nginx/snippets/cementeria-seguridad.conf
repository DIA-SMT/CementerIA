# Encabezados de seguridad y compresión de CementerIA. Va en
# /etc/nginx/snippets/cementeria-seguridad.conf y se incluye a nivel server.
#
# OJO con add_header: una location que declare cualquier add_header deja de
# heredar TODOS los del server. Por eso las locations de los sitios no usan
# add_header.

# Solo https durante un año para este host. Sin includeSubDomains ni preload:
# no hay subdominios propios y no se compromete a otros hosts de smt.gob.ar.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# SAMEORIGIN y no DENY: el visor de adjuntos de la ficha es un <iframe> del
# mismo sitio (/adjuntos/<id>). Ningún otro sitio puede enmarcar la app.
add_header X-Frame-Options "SAMEORIGIN" always;
# A otros sitios (el derivador, wa.me) solo viaja el origen, nunca la ruta ni
# la query del buscador.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Una CSP mínima que no rompe nada: Next hidrata con scripts inline, así que
# script-src queda para cuando se agreguen nonces. Sin form-action: el botón de
# Cidituc lleva a /auth/ingresar, que redirige al derivador. La ruta de
# adjuntos agrega su propia CSP (sandbox; default-src 'none'); el navegador
# aplica las dos.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

# Compresión: Next ya comprime lo que genera; esto cubre lo que no venga
# comprimido. text/html va siempre.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json application/manifest+json image/svg+xml;
