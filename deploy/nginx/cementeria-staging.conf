# CementerIA, STAGING (docs/despliegue.md, "Staging"; pedidos A1, A4 y A5).
# Igual que producción (cementeria.conf) con su dominio, su puerto y sus logs.
# Va en /etc/nginx/sites-available/ y se
# enlaza en sites-enabled/. Necesita conf.d/cementeria-log.conf, los dos
# snippets/cementeria-*.conf y 00-cementeria-default.conf.
#
# Antes de usarlo, reemplazar:
#   __DOMINIO_STAGING__  el dominio de staging (pedido A4). Tiene que llevar
#                        "staging" en el nombre si se usa AUTH_DEV_LOGIN_STAGING
#                        (src/lib/entorno.ts, esHostDeStaging)
#   /etc/ssl/cementeria-staging/ la ruta del certificado municipal que instale Sistemas
#   127.0.0.1:3011       si el puerto de staging (<PUERTO_STAGING>) no es 3011; tiene
#                        que coincidir con PORT de cementeria-staging.service
# Por ejemplo: sed -i 's/__DOMINIO_STAGING__/cementerios-staging.smt.gob.ar/g' cementeria-staging.conf
# Después: nginx -t && systemctl reload nginx

upstream cementeria_staging {
    server 127.0.0.1:3011;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO_STAGING__;

    access_log /var/log/nginx/cementeria-staging-access.log cementeria;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04): http2 va en listen. Desde 1.25.1 es `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO_STAGING__;

    # Cadena COMPLETA: el certificado del sitio y el intermedio (pedido A4).
    ssl_certificate /etc/ssl/cementeria-staging/fullchain.pem;
    ssl_certificate_key /etc/ssl/cementeria-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cementeria_staging_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Sin query string ni Referer (ver conf.d/cementeria-log.conf).
    access_log /var/log/nginx/cementeria-staging-access.log cementeria;
    error_log /var/log/nginx/cementeria-staging-error.log warn;

    # Fuera de la subida de adjuntos solo viajan formularios y Server Actions
    # (Next las limita a 1 MB): con 2m es Next, y no nginx, el que responde.
    client_max_body_size 2m;

    include snippets/cementeria-seguridad.conf;
    # Staging es interno y con datos ficticios: que ningún buscador lo indexe.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Solo desde la red municipal (pedido A5), si no lo resuelve el firewall de
    # Sistemas. Completar con los rangos que indique Sistemas:
    # allow 10.0.0.0/8;
    # deny all;

    # El callback de Cidituc: la query string trae el token. El access log no
    # tiene query (formato cementeria), pero un error de nginx escribe el
    # request entero; acá solo se registran los críticos.
    location = /auth/callback {
        error_log /var/log/nginx/cementeria-staging-error.log crit;
        include snippets/cementeria-proxy.conf;
        proxy_pass http://cementeria_staging;
    }

    # Subida de adjuntos (PDF, JPG o PNG de hasta 10 MB): el ÚNICO lugar con
    # 12m. El Route Handler lee el cuerpo en streaming, calcula el sha256 al
    # vuelo y corta si pasa de 10 MB; sin buffer de nginx en el medio. Si nginx
    # responde 413, la pantalla lo traduce en un mensaje claro.
    location ~ ^/api/expedientes/[^/]+/adjuntos$ {
        client_max_body_size 12m;
        proxy_request_buffering off;
        include snippets/cementeria-proxy.conf;
        proxy_pass http://cementeria_staging;
    }

    # El optimizador de imágenes de Next: la app no lo usa (el paquete no trae
    # sharp) y no tiene por qué quedar expuesto.
    location ^~ /_next/image {
        return 404;
    }

    location / {
        include snippets/cementeria-proxy.conf;
        proxy_pass http://cementeria_staging;
    }
}
