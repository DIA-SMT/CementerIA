# Formato del log de acceso de CementerIA (producción y staging). Va en
# /etc/nginx/conf.d/cementeria-log.conf: conf.d se incluye en el contexto
# http, que es donde viven log_format y map. Una sola vez por nginx, aunque
# haya dos instancias.
#
# Sin query string y sin Referer, en TODAS las rutas:
# - la query de /auth/callback trae el token de Cidituc (propuesta, sección 6,
#   "Autenticación", punto 7: el token nunca se loguea; pedido A4, punto 1);
# - la del buscador (/expedientes?q=…) trae nombres, CUIL y padrones, que son
#   datos personales (Ley 25.326) y no tienen por qué quedar en el log;
# - el Referer de una página propia lleva la URL completa, con esa misma query.
# Queda el método, la ruta (tal como llegó, sin decodificar), el status, el
# tamaño, el tiempo y el navegador. La IP es la del cliente ($remote_addr).

map $request_uri $cementeria_ruta {
    "~^(?<cementeria_sin_query>[^?]*)" $cementeria_sin_query;
    default "-";
}

log_format cementeria '$remote_addr [$time_local] "$request_method $cementeria_ruta $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';
