# Servidor por defecto: corta todo pedido cuyo Host no sea el de CementerIA
# (pedido A4, punto 5). Va en /etc/nginx/sites-available/ y se enlaza en
# sites-enabled/ UNA vez por VM (si producción y staging comparten VM, sirve
# para las dos).
#
# Por qué importa: con `proxy_set_header Host $host` nginx reenvía el Host que
# manda el cliente, y la app lo usa para decidir dónde ofrece el ingreso de
# prueba de staging y para validar el Origin de los POST. Que ningún otro Host
# llegue a la app es lo que vuelve confiable ese dato.
#
# Hay que sacar el sitio "default" de Ubuntu (rm /etc/nginx/sites-enabled/default):
# solo puede haber un default_server por puerto. Si la VM ya tiene otro
# default_server de Sistemas que hace lo mismo, este archivo no hace falta.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Sin certificado: un cliente que pide un nombre (SNI) que no es nuestro
    # no completa el handshake (nginx 1.19.4 o posterior; Ubuntu 24.04 trae 1.24).
    ssl_reject_handshake on;

    access_log /var/log/nginx/cementeria-rechazados.log cementeria;

    # 444: nginx cierra la conexión sin responder.
    return 444;
}
