# Integración continua: lo mismo que se corre a mano antes de cada commit
# (README, "Tests"), en tres jobs paralelos para que un e2e lento no tape un
# error de tipos.
#
# No hace falta ningún secreto: los tests de integración y los e2e levantan su
# propio PostgreSQL 15 efímero con embedded-postgres (los binarios de Linux
# vienen en el lockfile como dependencia opcional) y la app de los e2e corre con
# claves aleatorias y Cidituc apagado.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Coincide con el servidor (sección 6). Los tests unitarios e integración se
  # fuerzan a UTC en su propia configuración, a propósito.
  TZ: America/Argentina/Tucuman

jobs:
  verificar:
    name: Tipos, lint, unitarios y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx next build

  integracion:
    name: Integración (PostgreSQL efímero)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integracion

  e2e:
    name: Punta a punta (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
